<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - TMS Logística</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230ea5e9%22/><text x=%2250%22 y=%2267%22 text-anchor=%22middle%22 font-size=%2255%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22>T</text></svg>"
    >
</head>

<body class="auth-page login-page">

    <main class="login-wrapper">

        <section class="login-card">

            <div class="login-brand">
                <div class="login-brand-mark">
                    TMS
                </div>

                <div class="login-brand-text">
                    Logística
                </div>
            </div>

            <div class="login-heading">
    <h1>Bem-vindo de volta</h1>

    <p>
        Entre com suas credenciais para acessar o TMS Logística.
    </p>
</div>

            <form id="loginForm" class="login-form">

                <div class="input-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-auth login-submit">
                    Entrar no sistema
                </button>

            </form>

           

            <div class="login-register">
                <span>Ainda não possui uma conta?</span>

                <a href="cadastro.html">
                    Criar conta
                </a>
            </div>

            <div class="login-footer">
                <span class="login-status-dot"></span>
                <span>Sistema TMS operacional</span>
            </div>

        </section>

    </main>

    <script src="auth.js"></script>

</body>

</html>
