<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TMS Logística</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230ea5e9%22/><text x=%2250%22 y=%2267%22 text-anchor=%22middle%22 font-size=%2255%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22>T</text></svg>">
</head>
<body class="auth-page">

    <div class="login-container">
        <div class="logo" style="text-align: center; margin-bottom: 30px;">
            TMS<span>Logística</span>
        </div>
        
        <h2 style="text-align: center; margin-bottom: 20px; color: white;">Entrar no Sistema</h2>

        <form id="loginForm">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Digite o seu e-mail" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-auth">Entrar</button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">Ainda não tem conta?</span> 
            <a href="cadastro.html" style="color: var(--primary); font-weight: bold; margin-left: 5px;">Criar agora</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
