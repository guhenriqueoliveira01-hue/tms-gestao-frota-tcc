<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - TMS Logística</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="login-container">
        <div class="logo" style="text-align: center; margin-bottom: 30px;">
            TMS<span>Logística</span>
        </div>
        
        <h2 style="text-align: center; margin-bottom: 20px; color: white;">Criar Conta</h2>

        <form id="registerForm">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Seu nome e sobrenome" required>
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" required>
            </div>
            
            <button type="submit" class="btn-auth">Finalizar Cadastro</button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">Já possui uma conta?</span> 
            <a href="login.html" style="color: var(--primary); font-weight: bold; margin-left: 5px;">Fazer Login</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
